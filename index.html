<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3d21a">
<meta name="description" content="A self-contained university IT helpdesk demonstration covering the complete ticket lifecycle.">
<title>University IT Support — Helpdesk demo</title>
<style>
:root {
  color-scheme: light;
  /* Campus wayfinding palette: signal yellow routes work, ink anchors the signs. */
  --paper: #eff1ec;
  --paper-deep: #111a1d;
  --sheet: #ffffff;
  --sheet-alt: #fff7cf;
  --ink: #111a1d;
  --ink-soft: #29383b;
  --muted: #4a595c;
  --line: #c8d0d0;
  --line-strong: #7d898b;
  --vermilion: #f3d21a;
  --vermilion-deep: #10191c;
  --vermilion-wash: #fff7cf;
  --olive: #176044;
  --olive-wash: #e2efe8;
  --gold: #805300;
  --gold-wash: #fff0c7;
  --blue: #075b82;
  --blue-wash: #e4f2f8;
  --danger: #a02d26;
  --focus: #005d9e;
  --sans: "Avenir Next", Avenir, "Helvetica Neue", Arial, sans-serif;
  --serif: Georgia, "Times New Roman", serif;
  --measure: 72ch;
  --space-1: .25rem;
  --space-2: .5rem;
  --space-3: .75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
}
* { box-sizing: border-box; }
html { min-height: 100%; background: var(--paper); scrollbar-color: var(--line-strong) var(--paper); scrollbar-width: thin; }
body { margin: 0; min-width: 320px; min-height: 100dvh; background: var(--paper); color: var(--ink); font: 14px/1.5 var(--sans); font-variant-numeric: tabular-nums; }
::selection { background: #e1b8aa; color: #241e1a; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .55; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
svg { display: block; }
.icon { width: 18px; height: 18px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.app-shell { min-height: 100dvh; display: grid; grid-template-columns: 224px minmax(0,1fr); }
.sidebar { position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column; padding: 24px 16px 16px; background: var(--paper-deep); border-right: 1px solid var(--line); }
.brand { display: flex; gap: 11px; align-items: center; min-height: 44px; padding: 0 8px 22px; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
.brand-mark { display: grid; place-items: center; width: 34px; height: 34px; color: var(--vermilion); border: 1px solid var(--line-strong); }
.brand-name { font: 600 14px/1.25 var(--serif); letter-spacing: -.01em; }
.brand-name span { display: block; font: 11px/1.4 var(--sans); color: var(--muted); letter-spacing: .07em; text-transform: uppercase; }
.demo-note { margin: 18px 8px 20px; padding: 10px 0; color: var(--muted); font-size: 12px; line-height: 1.5; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.demo-note strong { display: block; margin-bottom: 2px; color: var(--ink-soft); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.side-label { padding: 0 8px; margin: 0 0 7px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
.side-nav { display: grid; gap: 3px; }
.nav-item { display: flex; align-items: center; width: 100%; min-height: 39px; padding: 8px 10px; gap: 10px; text-align: left; border: 1px solid transparent; background: transparent; color: var(--ink-soft); }
.nav-item:hover { background: rgb(255 255 255 / .35); color: var(--ink); }
.nav-item[aria-current="page"] { color: var(--ink); background: var(--sheet); border-color: var(--line); }
.nav-item[aria-current="page"] .icon { color: var(--vermilion); }
.nav-count { margin-left: auto; color: var(--muted); font-size: 12px; }
.sidebar-bottom { margin-top: auto; border-top: 1px solid var(--line); padding-top: 13px; }
.profile { display: flex; gap: 10px; align-items: center; padding: 6px 7px 12px; }
.avatar { display: inline-grid; place-items: center; width: 32px; height: 32px; flex: 0 0 auto; border: 1px solid var(--line-strong); background: var(--sheet); color: var(--ink-soft); font: 600 12px var(--sans); }
.profile-name { display: block; font-size: 12px; font-weight: 650; }
.profile-role { display: block; color: var(--muted); font-size: 12px; }
.reset-link { width: 100%; padding: 7px; border: 0; background: transparent; color: var(--muted); text-align: left; font-size: 12px; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; }
.reset-link:hover { color: var(--danger); text-decoration-color: currentColor; }
.main-shell { min-width: 0; }
.topbar { min-height: 64px; padding: 0 34px; display: flex; align-items: center; justify-content: space-between; gap: 18px; background: var(--sheet); border-bottom: 1px solid var(--line); }
.workspace-name { font: 600 13px var(--serif); }
.workspace-hint { margin-left: 9px; color: var(--muted); font-size: 12px; }
.top-actions { display: flex; align-items: center; gap: 10px; }
.role-select-wrap { position: relative; }
.role-select-wrap::after { content: ""; position: absolute; right: 10px; top: 50%; width: 6px; height: 6px; border-right: 1px solid var(--ink-soft); border-bottom: 1px solid var(--ink-soft); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
select, input[type="text"], input[type="search"], input[type="email"], input[type="date"], textarea { width: 100%; min-height: 39px; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 2px; background: var(--sheet); }
select { appearance: none; padding-right: 30px; }
textarea { min-height: 88px; resize: vertical; line-height: 1.5; }
input::placeholder, textarea::placeholder { color: #666e66; opacity: 1; }
.role-select { width: 190px; min-height: 36px; padding: 7px 30px 7px 10px; font-size: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 2px; background: var(--sheet); color: var(--ink); font-weight: 600; font-size: 12px; text-decoration: none; transition: background-color .16s ease, border-color .16s ease, color .16s ease; }
.btn:hover { background: #fffdf7; border-color: var(--ink-soft); }
.btn-primary { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.btn-primary:hover { background: #394038; border-color: #394038; }
.btn-accent { background: var(--vermilion); border-color: var(--vermilion); color: var(--ink); }
.btn-accent:hover { background: var(--vermilion-deep); border-color: var(--vermilion-deep); }
.btn-quiet { background: transparent; border-color: transparent; }
.btn-quiet:hover { background: var(--sheet-alt); border-color: var(--line); }
.btn-danger { color: var(--danger); border-color: #bb8175; background: transparent; }
.btn-danger:hover { color: #fff; background: var(--danger); border-color: var(--danger); }
.icon-button { position: relative; display: inline-grid; place-items: center; width: 38px; height: 38px; border: 1px solid transparent; background: transparent; color: var(--ink-soft); }
.icon-button:hover, .icon-button[aria-expanded="true"] { background: var(--sheet-alt); border-color: var(--line); }
.unread-dot { position: absolute; top: 7px; right: 7px; width: 7px; height: 7px; background: var(--vermilion); border: 1px solid var(--sheet); border-radius: 50%; }
main#mainContent { max-width: 1600px; margin: 0 auto; padding: 34px 34px 56px; }
.page-head { display: flex; justify-content: space-between; align-items: end; gap: 18px; padding-bottom: 22px; }
h1, h2, h3, p { margin-top: 0; }
h1 { margin-bottom: 6px; font: 400 clamp(28px,3vw,38px)/1.15 var(--serif); letter-spacing: -.025em; }
.page-description { max-width: var(--measure); margin: 0; color: var(--ink-soft); font-size: 13px; }
.page-head-meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: end; gap: 12px; color: var(--muted); font-size: 12px; }
.demo-label { display: inline-flex; align-items: center; gap: 7px; padding: 5px 8px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink-soft); font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.demo-label::before { content: ""; width: 6px; height: 6px; background: var(--olive); border-radius: 50%; }
.service-line { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; padding: 11px 0; margin-bottom: 16px; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line); color: var(--ink-soft); font-size: 12px; }
.service-line strong { color: var(--ink); font-weight: 700; }
.service-item { display: inline-flex; align-items: center; gap: 7px; }
.service-item::before { content: ""; width: 7px; height: 7px; border: 1px solid currentColor; border-radius: 50%; }
.service-item.is-risk::before { border-color: var(--vermilion); background: var(--vermilion); }
.service-item.is-waiting::before { border-color: var(--gold); background: var(--gold-wash); }
.workbench { display: grid; grid-template-columns: minmax(300px,.82fr) minmax(480px,1.18fr); border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); background: var(--sheet); }
.queue-panel { min-width: 0; border-right: 1px solid var(--line); }
.queue-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 15px 16px 9px; }
.queue-heading h2 { margin: 0; font: 600 17px/1.3 var(--serif); }
.queue-total { color: var(--muted); font-size: 12px; }
.queue-filters { display: grid; grid-template-columns: minmax(150px,1fr) 130px; gap: 8px; padding: 7px 16px 12px; }
.search-wrap { position: relative; }
.search-wrap .icon { position: absolute; left: 10px; top: 10px; width: 16px; height: 16px; color: var(--muted); }
.search-wrap input { padding-left: 34px; min-height: 36px; font-size: 12px; }
.filter-select { min-height: 36px; font-size: 12px; }
.filter-more { grid-column: 1/-1; display: flex; gap: 8px; }
.filter-more select { flex: 1 1 0; min-width: 0; min-height: 34px; padding-top: 6px; padding-bottom: 6px; font-size: 12px; }
.ticket-list { max-height: 710px; overflow: auto; scrollbar-color: var(--line-strong) var(--sheet); scrollbar-width: thin; }
.ticket-row { display: block; width: 100%; padding: 13px 16px 12px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; }
.ticket-row:hover { background: #f4f0e7; }
.ticket-row[aria-current="true"] { background: var(--sheet-alt); }
.row-top, .row-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.row-id { color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: .035em; }
.priority-mark { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-soft); font-size: 11px; font-weight: 700; }
.priority-mark::before { content: ""; width: 7px; height: 7px; border: 1px solid currentColor; border-radius: 50%; }
.priority-mark[data-priority="Critical"] { color: var(--danger); }
.priority-mark[data-priority="Critical"]::before, .priority-mark[data-priority="High"]::before { background: currentColor; }
.priority-mark[data-priority="High"] { color: #99502c; }
.priority-mark[data-priority="Normal"] { color: var(--blue); }
.priority-mark[data-priority="Low"] { color: var(--olive); }
.row-title { display: block; margin: 5px 0 8px; font: 600 14px/1.35 var(--serif); }
.row-bottom { justify-content: flex-start; flex-wrap: wrap; }
.status-mark { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-soft); font-size: 11px; font-weight: 700; letter-spacing: .045em; text-transform: uppercase; }
.status-mark::before { content: ""; width: 6px; height: 6px; border: 1px solid currentColor; }
.status-mark[data-status="New"]::before, .status-mark[data-status="Escalated"]::before { background: var(--vermilion); border-color: var(--vermilion); }
.status-mark[data-status="Waiting"]::before { background: var(--gold-wash); border-color: var(--gold); }
.status-mark[data-status="In progress"]::before, .status-mark[data-status="Reopened"]::before { background: var(--blue-wash); border-color: var(--blue); }
.status-mark[data-status="Resolved"]::before, .status-mark[data-status="Closed"]::before { background: var(--olive-wash); border-color: var(--olive); }
.row-person { overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
.row-deadline { margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; }
.row-deadline.is-late { color: var(--danger); font-weight: 700; }
.empty-queue { padding: 32px 18px; color: var(--muted); text-align: center; }
.empty-queue strong { display: block; margin-bottom: 4px; color: var(--ink); font: 600 17px var(--serif); }
.detail-panel { min-width: 0; padding: 20px 24px 26px; }
.detail-empty { min-height: 300px; display: grid; place-content: center; text-align: center; color: var(--muted); }
.detail-empty h2 { margin-bottom: 4px; color: var(--ink); font: 600 21px var(--serif); }
.detail-topline { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.record-id { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; margin-bottom: 7px; color: var(--muted); font-size: 11px; letter-spacing: .045em; }
.record-id .status-mark { font-size: 11px; }
.detail-title { margin: 0 0 7px; font: 400 clamp(22px,2.2vw,29px)/1.2 var(--serif); letter-spacing: -.02em; }
.detail-summary { max-width: 68ch; margin: 0; color: var(--ink-soft); font-size: 12px; line-height: 1.6; }
.detail-id-actions { display: flex; gap: 3px; }
.detail-id-actions .icon-button { width: 32px; height: 32px; }
.phase-wrap { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 16px; align-items: center; margin: 18px 0 20px; padding: 13px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.phase-title { margin: 0 0 8px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.phase-rail { --step: 0; position: relative; display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 2px; padding-top: 13px; }
.phase-rail::before { content: ""; position: absolute; top: 4px; left: 0; right: 0; height: 1px; background: var(--line-strong); }
.phase-rail::after { content: ""; position: absolute; top: 0; left: calc((100% - 6px) * var(--step) / 4); width: 9px; height: 9px; background: var(--vermilion); border: 1px solid var(--sheet); outline: 1px solid var(--vermilion); transition: left .5s cubic-bezier(.16,1,.3,1); }
.phase-step { color: var(--muted); font-size: 11px; line-height: 1.3; }
.phase-step.is-past, .phase-step.is-current { color: var(--ink); font-weight: 700; }
.phase-aside { min-width: 130px; text-align: right; }
.phase-aside strong { display: block; font: 600 13px var(--serif); }
.phase-aside span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
.field-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 14px 18px; margin: 0; padding: 0 0 18px; border-bottom: 1px solid var(--line); }
.field-grid div { min-width: 0; }
.field-grid dt { margin-bottom: 3px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.field-grid dd { overflow-wrap: anywhere; margin: 0; color: var(--ink); font-size: 12px; font-weight: 600; }
.sla-value.is-late { color: var(--danger); }
.journal-section { padding-top: 17px; }
.section-title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 11px; }
.section-title-row h3 { margin: 0; font: 600 17px var(--serif); }
.section-title-row span { color: var(--muted); font-size: 11px; }
.timeline { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
.timeline-item { position: relative; display: grid; grid-template-columns: 23px minmax(0,1fr); gap: 10px; padding: 0 0 14px; }
.timeline-item:not(:last-child)::before { content: ""; position: absolute; top: 16px; bottom: 0; left: 7px; width: 1px; background: var(--line); }
.timeline-mark { position: relative; z-index: 1; width: 15px; height: 15px; margin-top: 1px; display: grid; place-items: center; background: var(--sheet); border: 1px solid var(--line-strong); color: var(--muted); }
.timeline-mark .icon { width: 9px; height: 9px; }
.timeline-item.is-comment .timeline-mark { border-color: var(--blue); color: var(--blue); }
.timeline-item.is-internal .timeline-mark { border-color: var(--gold); color: var(--gold); }
.timeline-item.is-escalation .timeline-mark { border-color: var(--vermilion); color: var(--vermilion); }
.timeline-content { min-width: 0; }
.timeline-heading { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.timeline-heading strong { font-size: 12px; font-weight: 700; }
.timeline-heading time { color: var(--muted); font-size: 11px; }
.timeline-kind { color: var(--muted); font-size: 11px; letter-spacing: .035em; text-transform: uppercase; }
.timeline-body { max-width: 68ch; margin: 3px 0 0; color: var(--ink-soft); font-size: 12px; line-height: 1.55; overflow-wrap: anywhere; }
.internal-label { display: inline-block; margin-left: 5px; padding: 1px 4px; border: 1px solid #d1bc87; color: #634b1c; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.action-section { margin-top: 6px; padding-top: 16px; border-top: 1px solid var(--line-strong); }
.action-section h3 { margin: 0 0 10px; font: 600 16px var(--serif); }
.action-hint { margin: -4px 0 12px; color: var(--muted); font-size: 12px; }
.form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
.form-field { display: grid; gap: 5px; min-width: 0; }
.form-field.full { grid-column: 1/-1; }
.form-field label, .form-label { color: var(--ink-soft); font-size: 11px; font-weight: 700; letter-spacing: .035em; }
.form-field input, .form-field select, .form-field textarea { font-size: 12px; }
.form-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.action-divider { margin: 16px 0; border: 0; border-top: 1px solid var(--line); }
.comment-box { display: grid; gap: 9px; }
.comment-options { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; }
.inline-choice { display: flex; flex-wrap: wrap; gap: 12px; color: var(--ink-soft); font-size: 12px; }
.inline-choice label { display: inline-flex; align-items: center; gap: 5px; }
input[type="radio"], input[type="checkbox"] { accent-color: var(--vermilion); }
.assignment-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
.confirmation { margin: 12px 0 0; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.confirmation p { max-width: 62ch; margin: 0 0 10px; color: var(--ink-soft); font-size: 12px; }
.rating-form { display: flex; flex-wrap: wrap; gap: 14px; align-items: end; margin-top: 12px; }
.rating-scale { display: flex; gap: 5px; }
.rating-scale label { position: relative; display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--line-strong); background: var(--sheet); color: var(--ink); font-size: 12px; font-weight: 700; cursor: pointer; }
.rating-scale input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.rating-scale label:has(input:checked) { border-color: var(--vermilion); background: var(--vermilion-wash); color: var(--vermilion-deep); }
.rating-scale label:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.page-form, .report-surface, .knowledge-layout, .settings-layout { background: var(--sheet); border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); }
.page-form { max-width: 940px; padding: 22px 24px 28px; }
.form-intro { max-width: 68ch; margin-bottom: 22px; color: var(--ink-soft); font-size: 12px; }
.form-intro strong { color: var(--ink); }
.page-form .form-grid { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 17px 20px; }
.page-form .form-field input, .page-form .form-field select { min-height: 42px; }
fieldset.form-field { min-width: 0; margin: 0; padding: 0; border: 0; }
fieldset.form-field legend { margin-bottom: 6px; color: var(--ink-soft); font-size: 11px; font-weight: 700; letter-spacing: .035em; }
.choice-row { display: flex; flex-wrap: wrap; gap: 8px; }
.choice-row label { display: flex; align-items: flex-start; gap: 7px; padding: 8px 10px; border: 1px solid var(--line); background: var(--sheet-alt); color: var(--ink-soft); font-size: 12px; cursor: pointer; }
.choice-row label:has(input:checked) { border-color: var(--vermilion); color: var(--ink); background: var(--vermilion-wash); }
.priority-preview { grid-column: 1/-1; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); color: var(--ink-soft); font-size: 12px; }
.priority-preview strong { color: var(--ink); }
.file-input { display: block; width: 100%; padding: 8px; border: 1px dashed var(--line-strong); background: var(--sheet-alt); color: var(--ink-soft); font-size: 12px; }
.file-note { color: var(--muted); font-size: 11px; }
.form-error { margin: 0 0 10px; padding: 8px 10px; border: 1px solid #c39084; background: var(--vermilion-wash); color: var(--danger); font-size: 12px; }
.report-surface { padding: 20px 22px 24px; }
.report-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: baseline; padding-bottom: 13px; border-bottom: 1px solid var(--line); }
.report-head h2 { margin: 0; font: 600 19px var(--serif); }
.report-head p { margin: 0; color: var(--muted); font-size: 11px; }
.report-strip { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); margin: 0 0 22px; border-bottom: 1px solid var(--line); }
.report-stat { padding: 14px 13px 14px 0; }
.report-stat + .report-stat { padding-left: 15px; border-left: 1px solid var(--line); }
.report-stat dt { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.report-stat dd { margin: 2px 0 0; font: 400 23px/1.25 var(--serif); }
.report-stat small { display: block; color: var(--muted); font: 11px var(--sans); }
.report-columns { display: grid; grid-template-columns: minmax(0,1.1fr) minmax(260px,.9fr); gap: 30px; }
.report-columns h3, .knowledge-article h3, .settings-section h3 { margin: 0 0 11px; font: 600 17px var(--serif); }
.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.data-table th { padding: 8px 10px 8px 0; color: var(--muted); font-size: 11px; letter-spacing: .06em; text-align: left; text-transform: uppercase; border-bottom: 1px solid var(--line-strong); }
.data-table td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.data-table th:not(:first-child), .data-table td:not(:first-child) { text-align: right; }
.data-table td:first-child { color: var(--ink); font-weight: 600; }
.bar-list { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 75px minmax(0,1fr) 28px; gap: 8px; align-items: center; color: var(--ink-soft); font-size: 11px; }
.bar-track { height: 7px; background: var(--paper-deep); }
.bar-fill { height: 100%; background: var(--olive); }
.bar-row:nth-child(2) .bar-fill { background: var(--blue); }
.bar-row:nth-child(3) .bar-fill { background: #9a7a38; }
.bar-row:nth-child(4) .bar-fill { background: #ae7352; }
.late-list { margin: 22px 0 0; padding: 15px 0 0; border-top: 1px solid var(--line); }
.late-list h3 { margin-bottom: 8px; }
.late-list ul { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
.late-list button { width: 100%; display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; font-size: 11px; }
.late-list button:hover { color: var(--vermilion-deep); }
.late-list time { color: var(--danger); white-space: nowrap; }
.knowledge-layout { display: grid; grid-template-columns: minmax(220px,.55fr) minmax(0,1.45fr); min-height: 450px; }
.knowledge-index { padding: 18px; border-right: 1px solid var(--line); }
.knowledge-index h2 { margin: 0 0 10px; font: 600 17px var(--serif); }
.knowledge-index input { min-height: 36px; margin-bottom: 10px; font-size: 12px; }
.article-link { display: block; width: 100%; padding: 10px 0; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--ink-soft); text-align: left; font-size: 12px; }
.article-link:hover, .article-link[aria-current="true"] { color: var(--vermilion-deep); }
.knowledge-article { padding: 24px 28px; }
.knowledge-article h2 { margin: 0 0 7px; font: 400 26px/1.2 var(--serif); }
.knowledge-article .article-meta { margin-bottom: 20px; color: var(--muted); font-size: 11px; }
.knowledge-article p, .knowledge-article li { max-width: 70ch; color: var(--ink-soft); font-size: 12px; }
.knowledge-article ol { padding-left: 19px; }
.knowledge-article li { padding: 3px 0; }
.article-feedback { display: flex; gap: 8px; align-items: center; padding-top: 15px; margin-top: 24px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
.settings-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; padding: 22px; }
.settings-section + .settings-section { padding-left: 24px; border-left: 1px solid var(--line); }
.settings-section p { max-width: 56ch; color: var(--muted); font-size: 12px; }
.category-list { display: grid; margin: 12px 0 16px; padding: 0; list-style: none; }
.category-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 12px; }
.category-row small { color: var(--muted); }
.mini-form { display: flex; gap: 8px; align-items: end; }
.mini-form .form-field { flex: 1; }
.preference-line { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); font-size: 12px; }
.preference-line strong { display: block; font-size: 12px; }
.preference-line span { color: var(--muted); font-size: 11px; }
.notification-popover { position: fixed; z-index: 20; top: 58px; right: 260px; width: min(360px,calc(100vw - 24px)); padding: 15px 16px 10px; background: var(--sheet); border: 1px solid var(--line-strong);  }
.notification-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.notification-head h2 { margin: 0; font: 600 17px var(--serif); }
.notification-head button { border: 0; padding: 4px; background: transparent; color: var(--muted); font-size: 11px; text-decoration: underline; text-underline-offset: 3px; }
.notification-list { display: grid; }
.notification-item { display: block; width: 100%; padding: 10px 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; }
.notification-item:hover { color: var(--vermilion-deep); }
.notification-item strong { display: block; font-size: 12px; }
.notification-item span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
.notification-empty { padding: 18px 0; color: var(--muted); font-size: 12px; }
.toast-region { position: fixed; z-index: 30; right: 22px; bottom: 20px; display: grid; gap: 8px; width: min(380px,calc(100vw - 32px)); }
.toast { padding: 11px 14px; border: 1px solid var(--line-strong); background: var(--ink); color: #fffdf7; font-size: 12px; box-shadow: 0 7px 22px rgb(20 24 20 / .18); }
.toast.is-error { background: var(--danger); border-color: var(--danger); }
.mobile-back { display: none; }
@media (max-width: 1180px) {
  .app-shell { grid-template-columns: 205px minmax(0,1fr); }
  .topbar, main#mainContent { padding-left: 24px; padding-right: 24px; }
  .workbench { grid-template-columns: minmax(280px,.8fr) minmax(420px,1.2fr); }
  .detail-panel { padding: 18px; }
}
@media (max-width: 980px) {
  .app-shell { grid-template-columns: 1fr; }
  .sidebar { position: static; width: 100%; height: auto; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 15px; padding: 10px 18px; border-right: 0; border-bottom: 1px solid var(--line); }
  .brand { min-height: auto; padding: 0; border: 0; }
  .brand-mark { width: 31px; height: 31px; }
  .demo-note, .side-label, .sidebar-bottom { display: none; }
  .side-nav { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: thin; }
  .nav-item { flex: 0 0 auto; width: auto; min-height: 34px; padding: 6px 8px; font-size: 12px; }
  .nav-item .icon { width: 15px; height: 15px; }
  .nav-count { margin-left: 1px; }
  .topbar { min-height: 58px; }
  .notification-popover { top: 54px; right: 20px; }
}
@media (max-width: 760px) {
  main#mainContent { padding: 25px 18px 44px; }
  .topbar { padding: 0 18px; }
  .workspace-hint { display: none; }
  .role-select { width: 155px; font-size: 12px; }
  .top-actions { gap: 4px; }
  .top-actions > .btn { min-height: 35px; padding: 7px 9px; font-size: 12px; }
  .workbench { display: block; }
  .queue-panel { border-right: 0; }
  .detail-panel { display: none; padding: 18px 16px 24px; border-top: 1px solid var(--line-strong); }
  .workbench.is-detail .queue-panel { display: none; }
  .workbench.is-detail .detail-panel { display: block; }
  .mobile-back { display: inline-flex; margin: 0 0 12px; padding: 4px 0; border: 0; background: transparent; color: var(--ink-soft); font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }
  .queue-filters { grid-template-columns: minmax(120px,1fr) 125px; padding-left: 12px; padding-right: 12px; }
  .queue-heading { padding-left: 12px; padding-right: 12px; }
  .ticket-row { padding-left: 12px; padding-right: 12px; }
  .ticket-list { max-height: none; }
  .page-head { align-items: flex-start; flex-direction: column; gap: 10px; padding-bottom: 17px; }
  .page-head-meta { justify-content: flex-start; }
  .phase-wrap { grid-template-columns: 1fr; gap: 9px; }
  .phase-aside { text-align: left; }
  .field-grid { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
  .assignment-row { grid-template-columns: 1fr 1fr; }
  .assignment-row .btn { grid-column: 1/-1; }
  .report-columns { grid-template-columns: 1fr; gap: 25px; }
  .report-strip { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .report-stat:nth-child(3) { padding-left: 0; border-left: 0; border-top: 1px solid var(--line); }
  .report-stat:nth-child(4) { border-top: 1px solid var(--line); }
  .knowledge-layout { grid-template-columns: 1fr; }
  .knowledge-index { border-right: 0; border-bottom: 1px solid var(--line); }
  .knowledge-index nav { display: flex; gap: 10px; overflow-x: auto; }
  .article-link { flex: 0 0 190px; border-bottom: 1px solid var(--line); }
  .knowledge-article { padding: 20px 18px; }
  .settings-layout { grid-template-columns: 1fr; gap: 25px; padding: 18px; }
  .settings-section + .settings-section { padding: 20px 0 0; border-top: 1px solid var(--line); border-left: 0; }
}
@media (max-width: 500px) {
  .sidebar { grid-template-columns: 1fr; gap: 5px; padding: 8px 12px 5px; }
  .brand { padding-bottom: 6px; }
  .brand-name { font-size: 13px; }
  .side-nav { grid-row: 2; margin: 0 -12px; padding: 0 8px 4px; }
  .nav-item { font-size: 11px; }
  .nav-item .icon { display: none; }
  .topbar { min-height: 54px; padding: 0 12px; gap: 7px; }
  .workspace-name { font-size: 12px; }
  .role-select { width: 130px; min-height: 34px; font-size: 11px; }
  .top-actions { gap: 1px; }
  .top-actions > .btn { min-height: 33px; padding: 6px 7px; font-size: 11px; }
  .top-actions > .btn .icon { width: 15px; height: 15px; }
  .icon-button { width: 33px; height: 33px; }
  main#mainContent { padding: 20px 12px 34px; }
  h1 { font-size: 29px; }
  .service-line { gap: 11px; }
  .queue-filters { grid-template-columns: 1fr; }
  .filter-more { grid-column: 1; }
  .detail-topline { gap: 8px; }
  .detail-id-actions { margin-top: -7px; }
  .detail-title { max-width: 25ch; font-size: 24px; }
  .field-grid { gap: 10px; }
  .form-grid, .page-form .form-grid { grid-template-columns: 1fr; }
  .form-field.full, .priority-preview { grid-column: auto; }
  .assignment-row { grid-template-columns: 1fr; }
  .assignment-row .btn { grid-column: auto; }
  .page-form { padding: 18px 14px 22px; }
  .report-surface { padding: 16px 13px 20px; }
  .data-table { font-size: 11px; }
  .data-table th, .data-table td { padding-right: 6px; }
  .notification-popover { top: 50px; right: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
/* Campus wayfinding system */
html { background: var(--paper); scrollbar-color: var(--line-strong) var(--paper); }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); }
::selection { background: var(--vermilion); color: var(--ink); }
:focus-visible { outline-color: var(--focus); }
.app-shell { grid-template-columns: 236px minmax(0,1fr); background: var(--paper); }
.sidebar { background: var(--paper-deep); color: #fff; border: 0; padding: 22px 15px 15px; }
.brand { color: #fff; border-bottom: 1px solid #526064; padding: 0 7px 20px; }
.brand-mark { width: 38px; height: 38px; border: 0; background: var(--vermilion); color: var(--ink); }
.brand-mark .icon { width: 21px; height: 21px; stroke-width: 2; }
.brand-name { color: #fff; font: 750 15px/1.2 var(--sans); letter-spacing: -.025em; }
.brand-name span { margin-top: 3px; color: #f3d21a; font: 700 11px/1.4 var(--sans); letter-spacing: .11em; }
.demo-note { margin: 16px 4px 22px; padding: 10px 11px; background: #202c30; color: #e4ebea; border: 0; font-size: 12px; }
.demo-note strong { color: #f3d21a; font-size: 11px; letter-spacing: .1em; }
.side-label { color: #c2cdcc; padding: 0 8px; letter-spacing: .13em; }
.side-nav { gap: 4px; }
.nav-item { min-height: 42px; border: 0; color: #e2e9e8; font-weight: 650; }
.nav-item:hover { background: #283639; color: #fff; }
.nav-item[aria-current="page"] { background: var(--vermilion); color: var(--ink); border: 0; }
.nav-item[aria-current="page"] .icon { color: var(--ink); }
.nav-count { color: inherit; opacity: .78; font-variant-numeric: tabular-nums; }
.sidebar-bottom { border-top: 1px solid #526064; }
.profile-name { color: #fff; }
.profile-role { color: #c2cdcc; }
.avatar { color: var(--ink); background: var(--vermilion); border: 0; font-weight: 750; }
.reset-link { color: #d2dcda; }
.reset-link:hover { color: #f3d21a; }
.topbar { min-height: 66px; padding: 0 32px; background: var(--vermilion); color: var(--ink); border-bottom: 4px solid var(--ink); }
.workspace-name { font: 800 13px/1.3 var(--sans); letter-spacing: .09em; }
.workspace-hint { color: #29383b; font-size: 12px; }
.top-actions { gap: 9px; }
.role-select-wrap::after { border-color: var(--ink); }
select, input[type="text"], input[type="search"], input[type="email"], input[type="date"], textarea { min-height: 40px; border: 1px solid var(--line-strong); border-radius: 0; background: #fff; color: var(--ink); }
select { appearance: none; }
input::placeholder, textarea::placeholder { color: #506064; opacity: 1; }
.role-select { width: 202px; min-height: 38px; background-color: #fff; color: var(--ink); font-size: 12px; }
.btn { min-height: 40px; border: 1px solid var(--ink); border-radius: 0; background: #fff; color: var(--ink); font-weight: 700; font-size: 12px; }
.btn:hover { background: #f1f3ee; border-color: var(--ink); }
.btn-primary { color: #fff; background: var(--ink); border-color: var(--ink); }
.btn-primary:hover { color: var(--ink); background: var(--vermilion); border-color: var(--ink); }
.btn-accent { color: var(--ink); background: var(--vermilion); border-color: var(--ink); }
.btn-accent:hover { color: #fff; background: #29383b; border-color: #29383b; }
.btn-quiet { border-color: transparent; background: transparent; }
.btn-quiet:hover { background: var(--sheet-alt); border-color: var(--line-strong); }
.btn-danger { color: var(--danger); border-color: var(--danger); background: #fff; }
.btn-danger:hover { color: #fff; background: var(--danger); border-color: var(--danger); }
.icon-button { color: var(--ink); border: 1px solid transparent; }
.icon-button:hover, .icon-button[aria-expanded="true"] { background: #fff; border-color: var(--ink); }
.unread-dot { background: var(--danger); border-color: var(--vermilion); }
main#mainContent { padding: 26px 32px 54px; }
.page-head { position: relative; align-items: center; min-height: 132px; gap: 24px; margin: 0 0 16px; padding: 22px 25px 21px; color: #fff; background: var(--ink); border-bottom: 7px solid var(--vermilion); }
.page-head > div:first-child { max-width: 70ch; }
h1 { margin-bottom: 7px; color: #fff; font: 750 clamp(28px,3vw,40px)/1.08 var(--sans); letter-spacing: -.03em; }
.page-description { color: #e2e9e8; font-size: 13px; line-height: 1.55; }
.page-head-meta { justify-content: flex-end; color: #e2e9e8; }
.demo-label { padding: 7px 9px; border: 1px solid var(--vermilion); background: var(--vermilion); color: var(--ink); font-size: 11px; letter-spacing: .08em; }
.demo-label::before { width: 7px; height: 7px; background: var(--ink); border-radius: 0; }
.service-line { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 0; margin-bottom: 16px; padding: 0; border: 2px solid var(--ink); background: #202c30; color: #fff; }
.service-item { min-height: 46px; padding: 8px 12px; color: #f3f7f5; border-right: 1px solid #586366; }
.service-item:last-child { border-right: 0; }
.service-item::before { width: 8px; height: 8px; border-radius: 0; }
.service-line strong { color: var(--vermilion); font-size: 16px; font-weight: 800; }
.service-item.is-risk::before { background: var(--danger); border-color: #fff; }
.service-item.is-waiting::before { background: var(--gold-wash); border-color: var(--vermilion); }
.workbench { grid-template-columns: minmax(320px,.84fr) minmax(480px,1.16fr); border: 2px solid var(--ink); background: #fff; }
.queue-panel { border-right: 1px solid var(--line-strong); }
.queue-heading { min-height: 53px; padding: 12px 15px; align-items: center; background: var(--ink); color: #fff; }
.queue-heading h2 { color: #fff; font: 800 14px/1.3 var(--sans); letter-spacing: .045em; text-transform: uppercase; }
.queue-total { padding: 4px 7px; background: var(--vermilion); color: var(--ink); font-size: 11px; font-weight: 800; }
.queue-filters { padding: 11px 12px; background: #e6eae6; border-bottom: 1px solid var(--ink); }
.queue-filters input, .queue-filters select { min-height: 37px; border-color: #798688; font-size: 12px; }
.search-wrap .icon { color: #364649; }
.filter-more { gap: 7px; }
.ticket-list { max-height: 730px; background: #fff; scrollbar-color: #879394 #e6eae6; }
.ticket-row { position: relative; padding: 13px 38px 13px 15px; border-top: 1px solid var(--line); background: #fff; }
.ticket-row:hover { background: #f3f5f1; }
.ticket-row[aria-current="true"] { background: var(--sheet-alt); box-shadow: none; }
.ticket-row[aria-current="true"]::after { content: ""; position: absolute; top: 50%; right: 16px; width: 9px; height: 9px; border-top: 2px solid var(--ink); border-right: 2px solid var(--ink); transform: translateY(-50%) rotate(45deg); }
.row-id { color: #344447; font-size: 11px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
.priority-mark { font-size: 11px; letter-spacing: .03em; text-transform: uppercase; }
.priority-mark::before { width: 8px; height: 8px; border-radius: 0; }
.priority-mark[data-priority="High"] { color: #8e431b; }
.row-title { margin: 6px 0 8px; color: var(--ink); font: 700 14px/1.35 var(--sans); letter-spacing: -.012em; }
.row-bottom { gap: 8px 12px; }
.status-mark { gap: 6px; color: #263639; font-size: 11px; letter-spacing: .075em; }
.status-mark::before { width: 8px; height: 8px; }
.status-mark[data-status="New"]::before { background: var(--vermilion); border-color: var(--ink); }
.status-mark[data-status="Escalated"]::before { background: var(--danger); border-color: var(--danger); }
.status-mark[data-status="Waiting"]::before { background: var(--gold-wash); border-color: var(--gold); }
.status-mark[data-status="In progress"]::before, .status-mark[data-status="Reopened"]::before { background: var(--blue-wash); border-color: var(--blue); }
.status-mark[data-status="Resolved"]::before, .status-mark[data-status="Closed"]::before { background: var(--olive-wash); border-color: var(--olive); }
.row-person, .row-deadline { color: #4a595c; font-size: 11px; }
.row-deadline.is-late { color: var(--danger); font-weight: 800; }
.empty-queue { padding: 34px 18px; color: #415154; }
.empty-queue strong { color: var(--ink); font: 750 17px var(--sans); }
.detail-panel { padding: 22px 24px 28px; background: #fff; }
.detail-empty { color: #4a595c; }
.detail-empty h2 { color: var(--ink); font: 750 22px var(--sans); }
.detail-topline { padding-bottom: 15px; border-bottom: 1px solid var(--line); }
.record-id { color: #435255; font-size: 11px; font-weight: 750; letter-spacing: .075em; text-transform: uppercase; }
.detail-title { color: var(--ink); font: 750 clamp(22px,2.2vw,30px)/1.16 var(--sans); letter-spacing: -.027em; }
.detail-summary { color: #364649; font-size: 13px; line-height: 1.6; }
.phase-wrap { grid-template-columns: minmax(0,1fr) auto; gap: 16px; align-items: center; margin: 18px -24px 20px; padding: 14px 24px 15px; background: #eef1ed; border-top: 4px solid var(--vermilion); border-bottom: 1px solid var(--line-strong); }
.phase-title { color: #344447; font-size: 11px; letter-spacing: .12em; }
.phase-rail { gap: 0; padding-top: 0; }
.phase-rail::before { top: 6px; height: 2px; background: #879394; }
.phase-rail::after { display: none; }
.phase-step { position: relative; padding-top: 20px; color: #48575a; font-size: 11px; }
.phase-step::before { content: ""; position: absolute; z-index: 2; top: 0; left: 0; width: 14px; height: 14px; background: #fff; border: 2px solid var(--ink); }
.phase-step:not(:last-child)::after { content: ""; position: absolute; top: 6px; left: 15px; right: 0; height: 2px; background: #879394; }
.phase-step.is-past::before { background: var(--ink); }
.phase-step.is-past:not(:last-child)::after { background: var(--ink); }
.phase-step.is-past, .phase-step.is-current { color: var(--ink); font-weight: 800; }
.phase-step.is-current::before { top: -1px; width: 16px; height: 16px; background: var(--vermilion); border: 2px solid var(--ink); }
.phase-aside { min-width: 138px; padding: 8px 10px; background: var(--ink); color: #fff; text-align: left; }
.phase-aside strong { color: var(--vermilion); font: 800 13px var(--sans); }
.phase-aside span { color: #e2e9e8; font-size: 11px; }
.field-grid { gap: 15px 17px; padding-bottom: 20px; border-color: var(--line-strong); }
.field-grid dt { color: #4a595c; font-size: 11px; letter-spacing: .09em; }
.field-grid dd { color: var(--ink); font-size: 13px; font-weight: 700; }
.sla-value.is-late { color: var(--danger); }
.journal-section { padding-top: 20px; }
.section-title-row h3 { color: var(--ink); font: 800 15px var(--sans); letter-spacing: .035em; text-transform: uppercase; }
.section-title-row span { color: #4a595c; font-size: 11px; }
.timeline-item { grid-template-columns: 25px minmax(0,1fr); gap: 10px; padding-bottom: 16px; }

    else if (form.id === "commentForm") handleComment(form);
    else if (form.id === "ratingForm") handleRating(form);
    else if (form.id === "categoryForm") handleCategory(form);
  });
  root.addEventListener("input", event => {
    if (event.target.id === "searchInput") {
      state.query = event.target.value;
      refreshTicketList();
    } else if (event.target.id === "knowledgeSearch") {
      state.query = event.target.value;
      const active = document.activeElement;
      const start = active.selectionStart;
      const end = active.selectionEnd;
      const scroll = $(".knowledge-index nav")?.scrollLeft || 0;
      renderApp();
      const next = $("#knowledgeSearch"); next?.focus(); next?.setSelectionRange(start, end);
      const nav = $(".knowledge-index nav"); if (nav) nav.scrollLeft = scroll;
    } else if (["impact", "urgency"].includes(event.target.name)) priorityPreview();
  });
  root.addEventListener("change", event => {
    if (event.target.id === "statusFilter") { state.statusFilter = event.target.value; refreshTicketList(); }
    if (event.target.id === "categoryFilter") { state.categoryFilter = event.target.value; refreshTicketList(); }
    if (event.target.id === "priorityFilter") { state.priorityFilter = event.target.value; refreshTicketList(); }
    if (event.target.name === "impact" || event.target.name === "urgency") priorityPreview();
  });
  $("#sideNav").addEventListener("click", event => {
    const button = event.target.closest("[data-page]"); if (button) navigate(button.dataset.page);
  });
  $("#notificationPanel").addEventListener("click", event => {
    if (event.target.closest('[data-action="mark-notifications"]')) { markAllNotifications(); return; }
    const notification = event.target.closest("[data-notification]");
    const ticketButton = event.target.closest("[data-open-ticket]");
    if (notification) {
      const item = state.notifications.find(n => n.id === notification.dataset.notification);
      if (item) item.read = true;
    }
    if (ticketButton) {
      $("#notificationPanel").hidden = true;
      $("#notificationsButton").setAttribute("aria-expanded", "false");
      chooseTicket(ticketButton.dataset.openTicket);
    } else if (notification) {
      persist(); renderApp();
    }
  });
  $("#roleSelect").addEventListener("change", event => {
    state.role = event.target.value;
    state.page = "queue";
    state.query = ""; state.statusFilter = "all"; state.categoryFilter = "all"; state.priorityFilter = "all";
    const visible = getRoleTickets();
    if (!visible.some(t => t.id === state.selectedId)) state.selectedId = visible[0]?.id || null;
    mobileDetail = false;
    persist(); renderApp();
    showToast(`${roleNames[state.role]} view is active. This selector simulates role access.`);
  });
  $("#newRequestButton").addEventListener("click", () => navigate("new"));
  $("#notificationsButton").addEventListener("click", () => {
    const button = $("#notificationsButton");
    const open = button.getAttribute("aria-expanded") === "true";
    button.setAttribute("aria-expanded", String(!open));
    $("#notificationPanel").hidden = open;
    if (!open) { $("#notificationPanel").innerHTML = renderNotifications(); $("#notificationPanel").querySelector("button")?.focus(); }
  });
  $("#resetDemo").addEventListener("click", () => {
    try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
    state = initialState(); mobileDetail = false; renderApp(); showToast("Demonstration data reset to the original sample tickets.");
  });
  document.addEventListener("click", event => {
    if (!event.target.closest("#notificationPanel") && !event.target.closest("#notificationsButton")) {
      $("#notificationPanel").hidden = true;
      $("#notificationsButton").setAttribute("aria-expanded", "false");
    }
  });
  renderApp();
})();
</script>
</body>
</html>
